<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>calendar-cn · 二次元 / 国风 / 科技幻想</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f5;color:#263246;font:15px/1.6 "Microsoft YaHei UI",sans-serif}header{padding:24px 32px;background:white;border-bottom:1px solid #dae0e8}h1{font-size:24px;margin:0}header p{margin:4px 0 0;color:#6b7788}main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 115px)}nav{padding:22px;display:flex;flex-direction:column;gap:8px}nav button{padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;background:white;border:1px solid #dbe1e8;border-radius:10px;cursor:pointer;color:inherit;font:inherit}nav button[aria-selected=true]{border-color:#4277bc;box-shadow:0 0 0 2px #4277bc33}nav small{display:block;color:#6a778a;font-size:12px}.dot{width:24px;height:24px;border-radius:50%;border:1px solid #bbc4d0;flex-shrink:0}.viewer{padding:25px;display:grid;grid-template-columns:minmax(300px,1fr) 260px;align-items:start;gap:25px}.preview{text-align:center}.preview img{max-width:100%;max-height:calc(100vh - 165px);border-radius:8px;box-shadow:0 12px 35px #1b29401f}.info{background:white;padding:23px;border-radius:14px}.info h2{margin:0;font-size:25px}.en{color:#68758a}.chips{display:flex;gap:10px;margin:20px 0}.chip{width:32px;height:32px;border-radius:8px;border:1px solid #ccd4df}.legend{margin:22px 0}.tag{color:white;padding:2px 6px;border-radius:4px;margin-right:8px}.rest{background:#16834b}.work{background:#b85b00}.hint{color:#68758a;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}a,.actions button{font:inherit;color:#315f99;text-decoration:none;border:1px solid #ccd8e8;border-radius:7px;padding:7px 10px;background:white;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #668aba}.index{font-size:13px;color:#8190a1;margin-top:15px}@media(max-width:950px){.viewer{grid-template-columns:1fr}.info{max-width:500px;margin:auto}.preview img{max-height:none}}@media(max-width:620px){main{display:block}nav{display:grid;grid-template-columns:1fr 1fr}header{padding:20px}.viewer{padding:16px}} </style></head>
<body><header><h1>calendar-cn · 二次元 / 国风 / 科技幻想</h1><p>统一展示 2026 年 10 月：1—7 日放假，10 日调休上班。新增十套艺术主题；原有主题保留。可用键盘左右键切换。</p></header><main><nav id="themes" aria-label="主题列表"></nav><section class="viewer"><div class="preview"><a id="full" target="_blank" style="border:0;padding:0;background:none"><img id="preview" alt=""></a></div><aside class="info"><h2 id="name"></h2><div class="en" id="english"></div><div class="en" id="category"></div><div class="chips" id="chips"></div><div id="mode"></div><div class="legend"><div><span class="tag rest">休</span>放假</div><div style="margin-top:8px"><span class="tag work">班</span>调休上班</div></div><p class="hint">设计预览，不是系统实拍。主题配置提供插画、渐变、纯色三种背景；此处展示插画版本。</p><div class="actions"><button id="previous">上一套</button><button id="next">下一套</button><a id="download" download>下载大图</a><a id="prompt" target="_blank">创意提示词</a></div><div class="index" id="index"></div></aside></section></main><script>
const themes=[{"id": "star-rail-letter", "name": "星轨来信", "nameEn": "Starlit Rail", "mode": "Dark", "background": "#10203A", "foreground": "#F4F5FF", "accent": "#F5ADCF", "border": "#58769F", "number": 11, "collection": "expressive", "category": "二次元", "prompt": "prompts/star-rail-letter.txt", "preview": "previews/11-star-rail-letter.png"}, {"id": "seaside-soda", "name": "海盐汽水", "nameEn": "Seaside Soda", "mode": "Light", "background": "#EAF7F4", "foreground": "#203F54", "accent": "#D66746", "border": "#9CCBCF", "number": 12, "collection": "expressive", "category": "二次元", "prompt": "prompts/seaside-soda.txt", "preview": "previews/12-seaside-soda.png"}, {"id": "neon-rain", "name": "雨夜霓虹", "nameEn": "Neon Rain", "mode": "Dark", "background": "#170E2D", "foreground": "#F9ECFF", "accent": "#FC75C8", "border": "#7157AC", "number": 13, "collection": "expressive", "category": "赛博科技", "prompt": "prompts/neon-rain.txt", "preview": "previews/13-neon-rain.png"}, {"id": "mecha-protocol", "name": "机甲协议", "nameEn": "Mecha Protocol", "mode": "Light", "background": "#EEF0EF", "foreground": "#243449", "accent": "#BF5934", "border": "#9DA9B4", "number": 14, "collection": "expressive", "category": "机甲工业", "prompt": "prompts/mecha-protocol.txt", "preview": "previews/14-mecha-protocol.png"}, {"id": "jade-panorama", "name": "千里青绿", "nameEn": "Jade Panorama", "mode": "Light", "background": "#E8F1DE", "foreground": "#163F36", "accent": "#256F58", "border": "#9CBF9E", "number": 15, "collection": "expressive", "category": "国风青绿", "prompt": "prompts/jade-panorama.txt", "preview": "previews/15-jade-panorama.png"}, {"id": "dunhuang-reverie", "name": "敦煌飞天", "nameEn": "Dunhuang Reverie", "mode": "Light", "background": "#F7E6C9", "foreground": "#603722", "accent": "#AA4E30", "border": "#CB9D65", "number": 16, "collection": "expressive", "category": "国风壁画", "prompt": "prompts/dunhuang-reverie.txt", "preview": "previews/16-dunhuang-reverie.png"}, {"id": "changan-moon", "name": "鹤月长安", "nameEn": "Moon over Changan", "mode": "Dark", "background": "#102829", "foreground": "#FFF1D4", "accent": "#F1BB63", "border": "#8E7348", "number": 17, "collection": "expressive", "category": "国风夜景", "prompt": "prompts/changan-moon.txt", "preview": "previews/17-changan-moon.png"}, {"id": "orbital-atlas", "name": "星舰航图", "nameEn": "Orbital Atlas", "mode": "Dark", "background": "#0C1B2D", "foreground": "#EDF7FF", "accent": "#69D6ED", "border": "#4A718D", "number": 18, "collection": "expressive", "category": "航天科技", "prompt": "prompts/orbital-atlas.txt", "preview": "previews/18-orbital-atlas.png"}, {"id": "candy-dreamland", "name": "梦游糖果城", "nameEn": "Candy Dreamland", "mode": "Light", "background": "#F7E9FA", "foreground": "#4C355F", "accent": "#A3569B", "border": "#CAAAD6", "number": 19, "collection": "expressive", "category": "立体幻想", "prompt": "prompts/candy-dreamland.txt", "preview": "previews/19-candy-dreamland.png"}, {"id": "abyssal-codex", "name": "深海之书", "nameEn": "Abyssal Codex", "mode": "Dark", "background": "#0E2C30", "foreground": "#EDF8EB", "accent": "#D4C477", "border": "#6B8D7E", "number": 20, "collection": "expressive", "category": "奇幻装饰", "prompt": "prompts/abyssal-codex.txt", "preview": "previews/20-abyssal-codex.png"}, {"id": "frost-blue", "name": "霜蓝云雾", "nameEn": "Frosted Azure", "mode": "Light", "background": "#EDF5FF", "foreground": "#18324F", "accent": "#236DD6", "border": "#C4D8EE", "number": 1, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/01-frost-blue.png"}, {"id": "moon-ink", "name": "月白山水", "nameEn": "Moonlit Ink", "mode": "Light", "background": "#F3F0E7", "foreground": "#283C37", "accent": "#446B5A", "border": "#C9CEC2", "number": 2, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/02-moon-ink.png"}, {"id": "moss-garden", "name": "森间苔绿", "nameEn": "Moss Garden", "mode": "Light", "background": "#EEF3E8", "foreground": "#243E2A", "accent": "#426B39", "border": "#BED0B4", "number": 3, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/03-moss-garden.png"}, {"id": "amber-paper", "name": "琥珀书页", "nameEn": "Amber Paper", "mode": "Light", "background": "#F7EDDA", "foreground": "#4C3824", "accent": "#946128", "border": "#D8C4A2", "number": 4, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/04-amber-paper.png"}, {"id": "sakura-dawn", "name": "樱色晨光", "nameEn": "Sakura Dawn", "mode": "Light", "background": "#FFF0F3", "foreground": "#54344E", "accent": "#AB527D", "border": "#E5C8D8", "number": 5, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/05-sakura-dawn.png"}, {"id": "midnight-tide", "name": "深海静夜", "nameEn": "Midnight Tide", "mode": "Dark", "background": "#102536", "foreground": "#E5F4F7", "accent": "#59C8D2", "border": "#315265", "number": 6, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/06-midnight-tide.png"}, {"id": "aurora-violet", "name": "极光紫境", "nameEn": "Aurora Violet", "mode": "Dark", "background": "#221E3C", "foreground": "#F0ECFF", "accent": "#B19BF8", "border": "#544B77", "number": 7, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/07-aurora-violet.png"}, {"id": "graphite-studio", "name": "石墨极简", "nameEn": "Graphite Studio", "mode": "Dark", "background": "#26282B", "foreground": "#F1F2F4", "accent": "#C1CCD9", "border": "#50555D", "number": 8, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/08-graphite-studio.png"}, {"id": "vermilion-seal", "name": "朱砂新笺", "nameEn": "Vermilion Seal", "mode": "Light", "background": "#FFF4E6", "foreground": "#532C2D", "accent": "#B43E37", "border": "#DDC0AC", "number": 9, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/09-vermilion-seal.png"}, {"id": "desert-dusk", "name": "落日陶土", "nameEn": "Desert Dusk", "mode": "Light", "background": "#F8E9DE", "foreground": "#573B31", "accent": "#AD6146", "border": "#D9B29D", "number": 10, "collection": "classic", "category": "经典主题", "prompt": null, "preview": "previews/10-desert-dusk.png"}];let selected=0;const nav=document.querySelector('#themes');
themes.forEach((t,i)=>{let b=document.createElement('button');b.innerHTML=`<span class="dot" style="background:${t.background}"></span><span>${String(t.number).padStart(2,'0')} · ${t.name}<small>${t.nameEn}</small></span>`;b.onclick=()=>show(i);nav.appendChild(b)});
function show(i){selected=(i+themes.length)%themes.length;let t=themes[selected];document.querySelector('#preview').src=t.preview;document.querySelector('#preview').alt=t.name+'日历设计预览，含休班标记';document.querySelector('#full').href=t.preview;document.querySelector('#download').href=t.preview;document.querySelector('#name').textContent=t.name;document.querySelector('#english').textContent=t.nameEn;document.querySelector('#category').textContent=t.category;document.querySelector('#prompt').style.display=t.prompt?'inline-block':'none';if(t.prompt)document.querySelector('#prompt').href=t.prompt;document.querySelector('#mode').textContent=t.mode==='Dark'?'深色主题':'浅色主题';document.querySelector('#index').textContent=`${selected+1} / ${themes.length}`;document.querySelector('#chips').innerHTML=[t.background,t.foreground,t.accent,t.border].map(c=>`<span class="chip" title="${c}" style="background:${c}"></span>`).join('');[...nav.children].forEach((b,n)=>b.setAttribute('aria-selected',n===selected?'true':'false'))}
document.querySelector('#previous').onclick=()=>show(selected-1);document.querySelector('#next').onclick=()=>show(selected+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(selected-1);if(e.key==='ArrowRight')show(selected+1)});show(0);
</script></body></html>
